[package]
name = "seal"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
description = "An offline-first file integrity and signature verification utility"
repository = "https://github.com/k18labs/seal"
readme = "README.md"

[features]
default = ["blake3"]
blake3 = ["dep:blake3"]

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage"] }
clap_complete = "=4.6.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blake3 = { version = "1", optional = true }
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "ed25519", "getrandom"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
rpassword = "7.5.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".dependencies]
windows-permissions = "0.2.4"

[target."cfg(unix)".dependencies]
libc = "0.2"
