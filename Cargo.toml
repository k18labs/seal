[package]
name = "seal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "A minimal offline file integrity utility"
repository = "https://github.com/k18labs/seal"
readme = "README.md"

[features]
default = ["blake3"]
blake3 = ["dep:blake3"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blake3 = { version = "1", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
