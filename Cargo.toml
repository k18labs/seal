[package]
name = "seal"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "An offline-first file integrity and signature verification utility"
repository = "https://github.com/k18labs/seal"
readme = "README.md"

[features]
default = ["blake3"]
blake3 = ["dep:blake3"]

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blake3 = { version = "1", optional = true }
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "ed25519", "getrandom"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
