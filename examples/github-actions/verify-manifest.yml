name: Verify signed release manifest
on:
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: k18labs/seal
          ref: b92b8ce88e31ca6722b0370612063bc01176adbf # v1.0.0-rc.1 source commit
          path: seal-src
      - name: Build Seal from reviewed source
        working-directory: seal-src
        run: cargo build --release --locked
      - name: Verify archive provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify dist/release.tar.gz --repo k18labs/seal
          --signer-workflow k18labs/seal/.github/workflows/release.yml
      - name: Provision independently trusted public key
        env:
          SEAL_PUBLIC_KEY: ${{ secrets.SEAL_TRUSTED_PUBLIC_KEY }}
          EXPECTED_FINGERPRINT: ${{ vars.SEAL_TRUSTED_FINGERPRINT }}
        run: |
          test -n "$SEAL_PUBLIC_KEY"
          printf '%s\n' "$SEAL_PUBLIC_KEY" > trusted-release.pub
          actual="$(seal-src/target/release/seal key fingerprint --public-key trusted-release.pub)"
          test "$actual" = "$EXPECTED_FINGERPRINT"
      - name: Verify manifest and exact directory contents
        run: >-
          seal-src/target/release/seal manifest verify release.manifest
          --root dist --signature release.manifest.seal
          --public-key trusted-release.pub --json
