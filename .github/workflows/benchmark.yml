name: Operation benchmark

on:
  workflow_dispatch:
    inputs:
      size_mib:
        description: Input file size in MiB
        required: true
        default: "128"
        type: string
      runs:
        description: Repetitions per operation (minimum 3)
        required: true
        default: "7"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: macos-15
            name: macos-arm64
          - os: windows-2025
            name: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Build release binary
        run: cargo +1.96.0 build --release --locked
      - name: Install benchmark sampler
        run: python -m pip install psutil
      - name: Measure operations
        shell: bash
        run: |
          BIN=target/release/seal
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=target/release/seal.exe; fi
          python scripts/bench_operations.py --binary "$BIN" --large-mib "${{ inputs.size_mib }}" --runs "${{ inputs.runs }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operation-benchmark-${{ matrix.name }}
          path: operation-benchmark.json
          if-no-files-found: error
          retention-days: 30
