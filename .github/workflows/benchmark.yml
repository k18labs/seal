name: Hash benchmark

on:
  workflow_dispatch:
    inputs:
      size_mib:
        description: Input file size in MiB
        required: true
        default: "256"
        type: string
      runs:
        description: Hyperfine repetitions
        required: true
        default: "7"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain and hash benchmark tools
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          sudo apt-get update
          sudo apt-get install --yes hyperfine b3sum
      - name: Build release binary
        run: cargo +1.96.0 build --release --locked
      - name: Measure warm-cache hash commands
        run: python scripts/bench_hash.py --size-mib "${{ inputs.size_mib }}" --runs "${{ inputs.runs }}"
      - name: Measure startup, signatures, manifests, RSS, and binary size
        run: python scripts/bench_operations.py --large-mib "${{ inputs.size_mib }}" --runs "${{ inputs.runs }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seal-hash-benchmark
          path: |
            hash-bench.json
            benchmark-metadata.json
            operation-benchmark.json
          if-no-files-found: error
          retention-days: 30
