name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
      - name: Check formatting
        run: cargo +1.96.0 fmt --all -- --check
      - name: Test
        run: cargo +1.96.0 test --locked
      - name: Clippy
        run: cargo +1.96.0 clippy --all-targets --all-features --locked -- -D warnings
