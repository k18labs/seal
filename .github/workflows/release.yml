name: Release candidate artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (commit or tag)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            ext: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Install Rust and target
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup target add --toolchain 1.96.0 ${{ matrix.target }}
      - name: Build locked release binary
        run: cargo +1.96.0 build --release --locked --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: python scripts/package_release.py ${{ matrix.target }} ${{ matrix.ext }}
      - name: Attest packaged artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: seal-${{ matrix.target }}.${{ matrix.ext }}
      - name: Upload build candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seal-${{ matrix.target }}
          path: |
            seal-${{ matrix.target }}.${{ matrix.ext }}
            seal-${{ matrix.target }}.${{ matrix.ext }}.sha256
          if-no-files-found: error
          retention-days: 14

  sbom:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Generate CycloneDX SBOM for locked dependency graph
        run: |
          cargo +1.96.0 install cargo-cyclonedx --version 0.5.9 --locked
          cargo +1.96.0 cyclonedx --format json --all --target all --override-filename seal-sbom
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: seal-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seal-sbom
          path: seal-sbom.json
          if-no-files-found: error
          retention-days: 14
